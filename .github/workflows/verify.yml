name: verify

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/checkout@v4
        with:
          repository: GeorgePlattDemo/store-zero
          ref: 2c028da3e574734a7bc70b1f19399834c9b1656e
          path: .store-zero
      - name: System behavior and the pinned Store
        run: npm test
        env:
          STORE_ZERO_ROOT: ${{ github.workspace }}/.store-zero

      - name: Vercel production build
        run: npm run build
      - name: TypeScript acceptance (after generated route tree)
        run: npm run typecheck
      - name: Railway Node production build
        run: NITRO_PRESET=node-server npm run build && test -f .output/server/index.mjs
