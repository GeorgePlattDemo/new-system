name: verify

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/checkout@v4
        with:
          repository: GeorgePlattDemo/store-zero
          ref: 10d36c09ff6e0dac3c098a004821efea81a2b58d
          path: .store-zero
      - uses: actions/checkout@v4
        with:
          repository: GeorgePlattDemo/3d-solutions-program
          ref: ab23b32fa4b72aece9d0a43f60806d9b2cca0a88
          path: .program
      # Read-only current proof source, distinct from the runtime Store revision above.
      - uses: actions/checkout@v4
        with:
          repository: GeorgePlattDemo/store-zero
          ref: c4cd6b0d520005bde63223fb7b87b7e6c722d583
          path: .store-zero-docs
      - name: System behavior and the pinned Store
        run: npm test
        env:
          STORE_ZERO_ROOT: ${{ github.workspace }}/.store-zero
          STORE_DOCS_ROOT: ${{ github.workspace }}/.store-zero-docs

      - name: Railway production build
        run: npm run build && test -f .output/server/index.mjs
      - name: TypeScript acceptance (after generated route tree)
        run: npm run typecheck

  browser:
    name: Published five-project Chromium smoke
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/checkout@v4
        with:
          repository: GeorgePlattDemo/store-zero
          ref: 10d36c09ff6e0dac3c098a004821efea81a2b58d
          path: .store-zero
      - name: Install Chromium with system dependencies
        run: npx playwright install --with-deps chromium
      - name: Build the published System application
        run: npm run build && test -f .output/server/index.mjs
      - name: Start the two separate pinned services
        run: |
          STORE_ZERO_RELEASE=10d36c09ff6e0dac3c098a004821efea81a2b58d HOST=127.0.0.1 PORT=8091 node .store-zero/src/service/server.mjs >/tmp/stb-store-ci.log 2>&1 &
          STORE_ZERO_ORIGIN=http://127.0.0.1:8091 HOST=127.0.0.1 PORT=8080 NODE_ENV=production node .output/server/index.mjs >/tmp/stb-system-ci.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8091/health >/dev/null && curl -fsS http://127.0.0.1:8080/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/stb-store-ci.log /tmp/stb-system-ci.log
          exit 1
      - name: Exercise five published projects in Chromium
        run: node scripts/browser-five-jobs.mjs
      - name: Publish current Project 1 end-to-end proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-1-current-proof
          path: |
            artifacts/project-1-current-proof.json
            artifacts/visual/
          if-no-files-found: error
      - name: Display service logs on failure
        if: failure()
        run: cat /tmp/stb-store-ci.log /tmp/stb-system-ci.log || true
